name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy async_limiter
      - run: pytest

  build:
    # Catches packaging mistakes (bad metadata, missing files) on every pull
    # request instead of at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and check its version and type marker
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          test "$(python -c 'import async_limiter; print(async_limiter.__version__)')" = "$version"
          python -c "import async_limiter, pathlib; assert (pathlib.Path(async_limiter.__file__).parent / 'py.typed').exists()"
