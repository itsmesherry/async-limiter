[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "async-limiter"
version = "1.1.0"
description = "An asyncio rate limiter that enforces a concurrency limit and a requests-per-period limit together"
readme = "README.md"
authors = [
    {name = "Shehryar Sohail", email = "sherryyatwork@gmail.com"}
]
license = "MIT"
keywords = ["asyncio", "rate-limiter", "rate-limiting", "concurrency", "throttling", "api-client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/itsmesherry/async-limiter"
Repository = "https://github.com/itsmesherry/async-limiter"
Changelog = "https://github.com/itsmesherry/async-limiter/blob/main/CHANGELOG.md"
Issues = "https://github.com/itsmesherry/async-limiter/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.18.0",
    "aiohttp>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.18.0",
    "aiohttp>=3.8.0",
    "ruff>=0.10.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.setuptools]
packages = ["async_limiter"]

[tool.setuptools.package-data]
async_limiter = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["async_limiter"]
omit = ["tests/*"]
